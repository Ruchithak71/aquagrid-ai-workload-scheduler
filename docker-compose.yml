services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aquagrid-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./aquagrid.db
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aquagrid-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
